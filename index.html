<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PNP Philippines 18-Region Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([12.5, 122], 5);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);

fetch('Philippines_2026_18_Regions.geojson')
  .then(response => response.json())
  .then(data => {

    const regionLayer = L.geoJSON(data, {

      style: function(feature) {
        return {
          color: '#ffffff',
          weight: 1,
          fillColor: '#1f5fa9',
          fillOpacity: 0.75
        };
      },

      onEachFeature: function(feature, layer) {

        const region =
          feature.properties.Region_Display ||
          feature.properties.region ||
          feature.properties.psgc_name ||
          'Region';

        layer.bindTooltip(region);

      }

    }).addTo(map);

    map.fitBounds(regionLayer.getBounds());

  })
  .catch(error => {
    console.error('GeoJSON loading error:', error);
  });

</script>

</body>
</html>
